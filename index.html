er{padding:16px}main{display:flex;flex-direction:column}aside{border-right:0;border-bottom:1px solid #39443b;padding:20px}.stage{padding:16px}.canvas-wrap{min-height:300px}.bar{align-items:flex-start}}

body{background:#faf9f6;color:#1b1d1a;font-family:Georgia,serif}header{padding:24px 40px;border-color:#deded8}header strong{font-family:Georgia,serif;font-weight:400;letter-spacing:-.04em;font-size:24px}header span,.micro{color:#858780}main{grid-template-columns:minmax(0,1fr) 290px}aside{grid-column:2;grid-row:1;border-right:0;border-left:1px solid #deded8;padding:34px 28px}.stage{grid-column:1;grid-row:1;padding:36px 40px}h1{font:400 30px Georgia,serif;letter-spacing:-.035em}p{color:#777b74}label{color:#777b74;font:11px Arial,sans-serif;letter-spacing:.05em;text-transform:none}input[type=text],select{background:white;color:#222;border:1px solid #d7d8d1;border-radius:0;padding:13px}button{background:#242722;border-color:#242722;color:white;font-weight:400}.swatch{color:#424640;font:12px Arial,sans-serif}.swatch input{border:1px solid #ddd}.range{accent-color:#383d38}.hint{color:#969b94}.canvas-wrap{background:white;border:1px solid #eeeee9}.status{color:#8b8f88}.status.error{color:#b44242}.credits{color:#9c9f99}.credits a{color:#6d756c}details summary{cursor:pointer;font:12px Arial,sans-serif;color:#777b74;margin-top:25px}header strong span{color:#252a24!important}@media(max-width:760px){main{display:flex;flex-direction:column}aside{order:0;border-left:0;border-bottom:1px solid #deded8;padding:22px}.stage{order:1;padding:18px}.canvas-wrap{min-height:300px}header{padding:18px}}
</style></head><body><header><strong>CIUDAD / ASCII<span style="color:#aaf38e">.</span></strong><span>Cartografía en caracteres</span></header><main><aside><h1>Tu ciudad en ASCII</h1><label for="place">Buscar lugar</label><input id="place" type="text" value="Zacatecas, México" placeholder="Ciudad, colonia o localidad"><button class="wide" id="search">Crear mapa ↗</button><select id="choices" aria-label="Resultados de búsqueda" hidden></select><button class="wide" id="load" hidden>Generar mapa</button><label>Colores</label><div class="colors"><div class="swatch"><input type="color" id="fg" value="#1b1d1a"> Símbolos</div><div class="swatch"><input type="color" id="bg" value="#ffffff"> Fondo</div></div><label for="symbols">Símbolos</label><select id="symbols"><option value="·+*#">Puntos y asteriscos · + * #</option><option value=".:+%#">Densidad . : + % #</option><option value="/\\|-">Líneas / \ | −</option><option value="01">Binario 0 1</option><option value="custom">Personalizados</option></select><input id="custom" type="text" maxlength="30" value="x+*#" aria-label="Símbolos personalizados" hidden><details><summary>Más opciones</summary><label for="detail">Detalle <span id="detailValue">140</span></label><input class="range" id="detail" type="range" min="70" max="220" value="140" step="10"><label for="size">Tamaño de descarga</label><select id="size"><option value="1800">1800 × 1200 px</option><option value="2400">2400 × 1600 px</option><option value="3600">3600 × 2400 px</option></select></details><button class="wide" id="download" disabled>Descargar PNG ↓</button></aside><section class="stage"><div class="bar"><span class="micro" id="location">ZACATECAS / MÉXICO</span><span class="micro">Calles → caracteres</span></div><div class="canvas-wrap"><canvas id="canvas" width="1800" height="1200" aria-label="Mapa ASCII"></canvas></div><div class="status" id="status" role="status">Buscando calles de Zacatecas…</div><div class="credits">Datos © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">colaboradores de OpenStreetMap</a> · Consulta: Overpass y Nominatim</div></section></main><script>
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d');let roads=[],bbox=null,seq=0,selectedTitle='Zacatecas, México';const defaults={south:22.695,west:-102.64,north:22.815,east:-102.45};function show(s,error=false){$('status').textContent=s;$('status').classList.toggle('error',error)}function limitBox(b){let cy=(b.south+b.north)/2,cx=(b.west+b.east)/2,halfY=Math.max(.008,Math.min((b.north-b.south)/2,.075)),halfX=Math.max(.012,Math.min((b.east-b.west)/2,.11));return{south:cy-halfY,north:cy+halfY,west:cx-halfX,east:cx+halfX}}function render(){let w=Number($('size').value),h=Math.round(w*2/3);canvas.width=w;canvas.height=h;ctx.fillStyle=$('bg').value;ctx.fillRect(0,0,w,h);if(!roads.length||!bbox){ctx.fillStyle=$('fg').value;ctx.font=`${Math.round(w*.012)}px monospace`;ctx.fillText('BUSCA UN LUGAR PARA COMENZAR',w*.08,h*.5);return}let cols=Number($('detail').value),rows=Math.round(cols*2/3*.52),small=document.createElement('canvas');small.width=cols;small.height=rows;let c=small.getContext('2d',{willReadFrequently:true});c.fillStyle='#000';c.fillRect(0,0,cols,rows);c.strokeStyle='#fff';c.lineWidth=.8;c.lineCap='round';const lat=(bbox.south+bbox.north)/2*Math.PI/180,spanX=(bbox.east-bbox.west)*Math.cos(lat),spanY=bbox.north-bbox.south,cellRatio=(w/cols)/(h/rows),scale=Math.min(cols/spanX,rows/(spanY*cellRatio)),offsetX=(cols-spanX*scale)/2,offsetY=(rows-spanY*scale*cellRatio)/2;for(const road of roads){if(!road.geometry||road.geometry.length<2)continue;c.beginPath();road.geometry.forEach((p,i)=>{let x=offsetX+(p.lon-bbox.west)*Math.cos(lat)*scale,y=offsetY+(bbox.north-p.lat)*scale*cellRatio;i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke()}const pixels=c.getImageData(0,0,cols,rows).data;let chars=$('symbols').value==='custom'?$('custom').value:$('symbols').value;chars=Array.from(chars||'*').filter(x=>x.trim());if(!chars.length)chars=['*'];let cellW=w/cols,cellH=h/rows;ctx.font=`${Math.floor(cellH*.98)}px monospace`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=$('fg').value;for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){let v=pixels[(y*cols+x)*4];if(v>28){let i=Math.min(chars.length-1,Math.floor(v/256*chars.length));ctx.fillText(chars[i],(x+.5)*cellW,(y+.52)*cellH)}}}
async function load(b,title){let current=++seq;bbox=limitBox(b);selectedTitle=title;$('location').textContent=title.toUpperCase();$('download').disabled=true;show('Consultando calles. Puede tardar unos segundos…');let q=`[out:json][timeout:40];way["highway"](${bbox.south},${bbox.west},${bbox.north},${bbox.east});out geom;`;let result;for(const endpoint of ['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter']){try{let r=await fetch(endpoint,{method:'POST',body:new URLSearchParams({data:q}),signal:AbortSignal.timeout(45000)});if(!r.ok)throw Error();result=await r.json();break}catch(e){}}if(current!==seq)return;if(!result){roads=[];render();show('No se pudieron obtener las calles. Revisa tu conexión e inténtalo nuevamente.',true);return}roads=result.elements.filter(e=>e.geometry?.length>1);render();$('download').disabled=!roads.length;show(roads.length?'Mapa listo.':'No se encontraron calles en esta zona.',!roads.length)}
$('search').onclick=async()=>{let text=$('place').value.trim();if(!text)return;show('Buscando lugar…');$('search').disabled=true;try{let url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q='+encodeURIComponent(text);let res=await fetch(url);if(!res.ok)throw Error();let items=await res.json();if(!items.length){show('No encontramos ese lugar. Intenta con otro nombre.',true);return}let item=items[0],b={south:+item.boundingbox[0],north:+item.boundingbox[1],west:+item.boundingbox[2],east:+item.boundingbox[3]};await load(b,item.display_name)}catch(e){show('No se pudo conectar. Intenta nuevamente.',true)}finally{$('search').disabled=false}};$('place').addEventListener('keydown',e=>{if(e.key==='Enter')$('search').click()});$('symbols').onchange=()=>{$('custom').hidden=$('symbols').value!=='custom';render()};['fg','bg','custom','detail','size'].forEach(id=>$(id).addEventListener('input',()=>{$('detailValue').textContent=$('detail').value;render()}));$('download').onclick=()=>{let a=document.createElement('a');a.download='ciudad-ascii.png';a.href=canvas.toDataURL('image/png');a.click()};render();load(defaults,'Zacatecas / Guadalupe');
</script></body></html>
